<!doctype html>
<html lang="es" data-exercise-id="17-http-crud" data-exercise-title="17 · CRUD contra una API">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starter · CRUD HTTP</title>
    <link rel="stylesheet" href="/shared/base.css">
    <link rel="stylesheet" href="/shared/exercise-shell.css">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="/shared/exercise-nav.mjs"></script>
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <main class="container exercise-shell">
      <section class="exercise-intro card">
        <h1>Administracion de productos</h1>
        <p>Implementa el ciclo completo de alta, edicion y borrado contra la API local.</p>
      </section>

      <section class="crud-layout">
        <section class="card editor" aria-labelledby="editor-title">
          <h2 id="editor-title" data-form-title>Nuevo producto</h2>
          <form data-form novalidate>
            <input type="hidden" name="id">
            <div class="field">
              <label for="name">Nombre</label>
              <input id="name" name="name" minlength="3" required>
              <p class="field__error" data-error-for="name"></p>
            </div>
            <div class="field">
              <label for="category">Categoria</label>
              <input id="category" name="category" minlength="2" required>
              <p class="field__error" data-error-for="category"></p>
            </div>
            <div class="field">
              <label for="price">Precio</label>
              <input id="price" name="price" type="number" min="0" step="0.01" required>
              <p class="field__error" data-error-for="price"></p>
            </div>
            <div class="field">
              <label for="stock">Stock</label>
              <input id="stock" name="stock" type="number" min="0" step="1" required>
              <p class="field__error" data-error-for="stock"></p>
            </div>
            <div class="form-actions">
              <button class="button" type="submit" data-submit>Guardar</button>
              <button class="button button--secondary" type="button" data-cancel hidden>Cancelar edicion</button>
            </div>
          </form>
          <p class="status-message" role="status" data-form-status></p>
        </section>

        <section class="card listing" aria-labelledby="listing-title">
          <div class="listing__header">
            <h2 id="listing-title">Productos</h2>
            <button class="button button--secondary" type="button" data-refresh>Recargar</button>
          </div>
          <p class="status-message" role="status" data-list-status></p>
          <div class="table-scroll">
            <table>
              <thead><tr><th scope="col">Nombre</th><th scope="col">Precio</th><th scope="col">Stock</th><th scope="col">Acciones</th></tr></thead>
              <tbody data-table-body></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
