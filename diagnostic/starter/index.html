<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starter · Diagnostico frontend</title>
    <link rel="stylesheet" href="/shared/base.css">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Saltar al contenido</a>
    <header class="header">
      <div class="container header__inner">
        <a href="/">Frontend Foundations</a>
        <span>Diagnostico inicial</span>
      </div>
    </header>
    <main id="content" class="container layout">
      <section class="intro">
        <p class="eyebrow">90 minutos</p>
        <h1>Catalogo diagnostico</h1>
        <p>Carga, filtra y crea productos sin framework.</p>
      </section>

      <section class="card panel" aria-labelledby="list-title">
        <div class="section-heading">
          <h2 id="list-title">Productos</h2>
          <label class="field">Filtrar <input type="search" data-search></label>
        </div>
        <p class="status-message" role="status" data-list-status></p>
        <div class="products" data-products></div>
      </section>

      <section class="card panel" aria-labelledby="form-title">
        <h2 id="form-title">Nuevo producto</h2>
        <form data-form>
          <label class="field">Nombre <input name="name" minlength="3" required></label>
          <label class="field">Categoria <input name="category" minlength="2" required></label>
          <label class="field">Precio <input name="price" type="number" min="0" step="0.01" required></label>
          <label class="field">Stock <input name="stock" type="number" min="0" step="1" required></label>
          <button class="button" type="submit">Crear</button>
        </form>
        <p class="status-message" role="status" data-form-status></p>
      </section>
    </main>
  </body>
</html>
